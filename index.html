<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Five-Letter Solver</title>
<style>:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #16181d; --muted: #5f6672; --border: #d9dde3;
  --grey: #7b8494; --yellow: #b7860f; --green: #3a9d5d; --tile-text: #ffffff;
  --accent: #2f6fde; --on-accent: #ffffff;
  --warn-bg: #fff1e6; --warn-text: #8a3b00; --info-bg: #eaf1fd; --info-text: #1d4f9c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --surface: #1b1e24; --text: #eceef2; --muted: #9aa2ae; --border: #2c3139;
    --grey: #4b5260; --yellow: #b8891a; --green: #2f8a50;
    --accent: #6fa0ff; --on-accent: #0b1630;
    --warn-bg: #3a2414; --warn-text: #ffc9a3; --info-bg: #182a47; --info-text: #b8d0ff;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
header, main { max-width: 480px; margin: 0 auto; padding: 0 16px; }
header { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; padding-bottom: 8px; }
h1 { font-size: 1.2rem; margin: 0; letter-spacing: 0.02em; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: 0.45; cursor: default; }
.icon-btn { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: 1.3rem; }
.header-actions { display: flex; gap: 8px; }
.icon-btn svg { display: block; margin: auto; }

.board-wrap { position: relative; max-width: 360px; margin: 8px auto 14px; }
#board { display: grid; gap: 8px; }
#guess {
  position: absolute; left: 0; bottom: 0; width: 100%; height: 44px; padding: 0; border: 0;
  opacity: 0; pointer-events: none; font-size: 16px; caret-color: transparent;
}
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tile {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 8px; padding: 0; color: var(--tile-text);
  font-size: 1.75rem; font-weight: 700; text-transform: uppercase; user-select: none;
}
.tile.c0 { background: var(--grey); }
.tile.c1 { background: var(--yellow); }
.tile.c2 { background: var(--green); }
.row.active .tile { outline: 2px solid var(--accent); outline-offset: 1px; }
.row.active .tile:empty { background: var(--surface); }
.row.active .tile.cursor { box-shadow: inset 0 -5px 0 var(--accent); }

.tile-hint { margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; text-align: center; }
.entry-row { display: flex; gap: 8px; }
#edit { flex: none; width: 48px; height: 48px; }
#next { flex: 1; }
.primary { height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.hint { margin: 6px 0 0; color: var(--warn-text); font-size: 0.9rem; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); text-decoration: underline; }

.controls { display: flex; gap: 8px; margin: 12px 0; }
.controls button { flex: 1; height: 44px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.controls .solve-btn { border-color: var(--green); background: var(--green); color: var(--tile-text); font-weight: 600; }

.status { margin: 8px 0; color: var(--muted); text-align: center; }
.status:empty { display: none; }
.status.solved { color: var(--green); font-size: 1.25rem; font-weight: 700; }
.banner { margin: 8px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); }
.banner.info { background: var(--info-bg); color: var(--info-text); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.pair .card { margin: 0; }
.label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
.big-word, .word-btn { display: block; background: none; border: 0; padding: 0; text-align: left; }
.big-word { font-size: 2.25rem; font-weight: 800; letter-spacing: 0.08em; }
.word-btn { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; margin-top: 2px; }
.splitters { list-style: none; margin: 0; padding: 0; }
.splitters li + li { margin-top: 6px; }
.note { font-size: 0.9rem; color: var(--muted); }
.note.probe { color: var(--warn-text); font-weight: 600; }
.stats { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
body.thinking #results { opacity: 0.5; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em; }
.chips.muted .chip { color: var(--muted); font-weight: 500; }
summary { cursor: pointer; font-weight: 600; }

dialog { width: min(92vw, 380px); padding: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgb(0 0 0 / 0.45); }
.field { display: grid; gap: 4px; margin-bottom: 12px; font-size: 0.9rem; }
.field input { height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.check input { width: 20px; height: 20px; }
.reset-stats { display: block; margin: 0 0 12px; }
#stats-body { margin-bottom: 16px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog-actions button:not(.primary) { height: 48px; padding: 0 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }

.round { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.round li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.round li.round-note { display: block; color: var(--muted); }
.mini-row { display: grid; grid-template-columns: repeat(5, 18px); gap: 2px; padding-top: 2px; }
.tile.mini { width: 18px; border-radius: 3px; font-size: 0.65rem; }
.round-text { margin: 0; font-size: 0.9rem; }
.round-closing { margin: 10px 0 0; font-weight: 600; }
.round-closing:empty { display: none; }
.stats-head { margin: 8px 0 10px; font-variant-numeric: tabular-nums; }
.stats-empty { margin: 8px 0 0; color: var(--muted); }
.dist { display: grid; gap: 4px; }
.dist-row { display: grid; grid-template-columns: 1.75em 1fr; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dist-key { color: var(--muted); font-size: 0.85rem; text-align: right; }
.dist-bar {
  justify-self: start; min-width: 1.75em; padding: 2px 6px; border-radius: 4px;
  background: var(--grey); color: var(--tile-text); font-size: 0.85rem; font-weight: 600; text-align: right;
}
.dist-row.mine .dist-bar { background: var(--green); }

@media (max-width: 359px) {
  header, main { padding-left: 12px; padding-right: 12px; }
  #board, .row { gap: 6px; }
}
</style>
</head>
<body>
<header>
  <h1>Five-Letter Solver</h1>
  <div class="header-actions">
    <button id="stats-btn" class="icon-btn" type="button" aria-label="Statistics"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 17v-7h3v7zm5.5 0V4h3v13zM14 17v-5h3v5z"/></svg></button>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">&#9881;&#xFE0E;</button>
  </div>
</header>
<main>
  <div class="board-wrap">
    <section id="board" aria-label="Guesses"></section>
    <!-- Invisible field over the active row: it brings up the phone keyboard; the tiles show what it holds. -->
    <input id="guess" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false" maxlength="5" aria-label="Guess you played">
  </div>
  <section id="entry">
    <p class="tile-hint">Tap letters to set colours · &#9998;&#xFE0E; to type</p>
    <div class="entry-row">
      <button id="edit" class="icon-btn" type="button" aria-label="Type a word">&#9998;&#xFE0E;</button>
      <button id="next" class="primary" type="button">Next</button>
    </div>
    <p id="hint" class="hint" hidden>Not in word list</p>
    <button id="make-default" class="link" type="button" hidden></button>
  </section>
  <div class="controls">
    <button id="undo" type="button">Undo</button>
    <button id="solved" class="solve-btn" type="button" aria-label="Solved: this was the answer">&#10003;&#xFE0E; Solved</button>
    <button id="new" type="button">New game</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <p id="banner" class="banner" role="alert" hidden></p>
  <section id="results" hidden>
    <div class="card">
      <div class="label">Recommended</div>
      <button id="rec-word" class="big-word" type="button"></button>
      <div id="rec-note" class="note"></div>
      <div id="rec-stats" class="stats"></div>
    </div>
    <div class="pair">
      <div class="card">
        <div class="label">Best splitters</div>
        <ol id="splitters" class="splitters"></ol>
      </div>
      <div class="card">
        <div class="label">Best answer</div>
        <button id="c-word" class="word-btn" type="button"></button>
        <div id="c-stats" class="stats"></div>
      </div>
    </div>
    <div class="card">
      <div id="cands-label" class="label"></div>
      <div id="cands" class="chips"></div>
      <button id="cands-more" class="link" type="button" hidden></button>
    </div>
    <details id="obscure-box" class="card">
      <summary id="obscure-label"></summary>
      <div id="obscure" class="chips muted"></div>
    </details>
  </section>
  <section id="summary" hidden>
    <div class="card">
      <div class="label">Round</div>
      <ol id="round" class="round"></ol>
      <p id="round-closing" class="round-closing"></p>
    </div>
    <div class="card">
      <div class="label">Statistics</div>
      <div id="summary-stats"></div>
    </div>
  </section>
</main>
<dialog id="settings">
  <form method="dialog" novalidate>
    <h2>Settings</h2>
    <label class="field">Starting word
      <input id="set-opener" type="text" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">Prefer a possible answer when this many candidates or fewer remain
      <input id="set-maxn" type="number" min="1" max="50" step="1" inputmode="numeric">
    </label>
    <label class="field">…and it is within this many expected guesses of the best splitter
      <input id="set-maxgap" type="number" min="0" max="1" step="0.01" inputmode="decimal">
    </label>
    <label class="check"><input id="set-extras" type="checkbox"> Include obscure fits in scoring</label>
    <button id="reset-stats" class="link reset-stats" type="button">Reset statistics</button>
    <div class="dialog-actions">
      <button value="cancel" type="button" data-cancel>Cancel</button>
      <button value="save" type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="confirm">
  <form method="dialog">
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button value="cancel" type="button" data-cancel>Cancel</button>
      <button id="confirm-ok" value="ok" type="submit" class="primary"></button>
    </div>
  </form>
</dialog>
<dialog id="stats">
  <form method="dialog">
    <h2>Statistics</h2>
    <div id="stats-body"></div>
    <div class="dialog-actions">
      <button value="close" type="submit" class="primary">Close</button>
    </div>
  </form>
</dialog>

  function encode(words) {

      else { marks[i] = 0; letterCounts[A[a + i]]++; }

    let p = 0;
    for (let i = 0; i < 5; i++) {
      let m = marks[i];
      if (m === 0) {

        if (letterCounts[k] > 0) { m = 1; letterCounts[k]--; }
      }
      p = p * 3 + m;
    }
    for (let i = 0; i < 5; i++) letterCounts[A[a + i]] = 0;

(function (root) {
  'use strict';

  const MAX_AGE_MS = 18 * 60 * 60 * 1000;
  const DEFAULT_SETTINGS = Object.freeze({ opener: 'slate', maxN: 6, maxGap: 0.1, includeExtras: false });
  const greys = () => [0, 0, 0, 0, 0];
  const present = v => v !== undefined && v !== null && v !== '';
  const validColors = c => Array.isArray(c) && c.length === 5 && c.every(x => x === 0 || x === 1 || x === 2);

    return String(text).toLowerCase().replace(/[^a-z]/g, '').slice(0, 5);
  }

  function validateSettings(input, prev) {

    if (typeof src.opener === 'string' && /^[a-z]{5}$/i.test(src.opener.trim())) {
      out.opener = src.opener.trim().toLowerCase();
    }
    const n = Number(src.maxN);
    if (present(src.maxN) && Number.isInteger(n) && n >= 1 && n <= 50) out.maxN = n;
    const gap = Number(src.maxGap);
    if (present(src.maxGap) && Number.isFinite(gap) && gap >= 0 && gap <= 1) out.maxGap = gap;
    if (typeof src.includeExtras === 'boolean') out.includeExtras = src.includeExtras;
    return out;
  }

  function newGame(opener, id) {
    return { id, rows: [], active: { word: opener, colors: greys() } };
  }

  function setActiveWord(game, text) {
    return { id: game.id, rows: game.rows, active: { word: sanitizeWord(text), colors: game.active.colors } };
  }

  function cycleColor(game, i) {
    const colors = game.active.colors.slice();
    colors[i] = (colors[i] + 1) % 3;
    return { id: game.id, rows: game.rows, active: { word: game.active.word, colors } };
  }

  function commit(game) {
    if (game.active.word.length !== 5) return game;
    const row = { word: game.active.word, colors: game.active.colors.slice() };
    return { id: game.id, rows: game.rows.concat([row]), active: { word: '', colors: greys() } };
  }

  function solve(game) {
    if (game.active.word.length !== 5) return game;
    return commit({ id: game.id, rows: game.rows, active: { word: game.active.word, colors: [2, 2, 2, 2, 2] } });
  }

  function undo(game) {
    if (game.rows.length === 0) return game;
    const last = game.rows[game.rows.length - 1];
    return { id: game.id, rows: game.rows.slice(0, -1), active: { word: last.word, colors: last.colors.slice() } };
  }

  function isSolved(game) {
    const last = game.rows[game.rows.length - 1];

  function needsDiscardConfirm(game) {
    return game.rows.length > 0 && !isSolved(game);

    if (!Array.isArray(d.rows) || !d.active) return null;
    const rowsOk = d.rows.every(r => r && typeof r.word === 'string' && /^[a-z]{5}$/.test(r.word) && validColors(r.colors));
    const activeOk = typeof d.active.word === 'string' && /^[a-z]{0,5}$/.test(d.active.word) && validColors(d.active.colors);

      rows: d.rows.map(r => ({ word: r.word, colors: r.colors.slice() })),
      active: { word: d.active.word, colors: d.active.colors.slice() },

<script>// Solved-game history and the statistics drawn from it. Pure functions; loaded as a classic
// script in the page (defines GameHistory) and via require() in Node tests.
(function (root) {
  'use strict';

  const LIMIT = 1000;
  const BUCKETS = ['1', '2', '3', '4', '5', '6', '7+'];
  const validColors = c => Array.isArray(c) && c.length === 5 && c.every(x => x === 0 || x === 1 || x === 2);
  const validRow = r => r && typeof r.word === 'string' && /^[a-z]{5}$/.test(r.word) && validColors(r.colors);
  const validGame = g => g && Number.isFinite(g.id) && Number.isFinite(g.at) &&
    Array.isArray(g.rows) && g.rows.length > 0 && g.rows.every(validRow);
  const copyGame = g => ({ id: g.id, at: g.at, rows: g.rows.map(r => ({ word: r.word, colors: r.colors.slice() })) });

  function empty() {
    return { v: 1, games: [] };
  }

  // Anything unreadable counts as no history; single bad records are dropped.
  function parse(json) {
    let d;
    try { d = JSON.parse(json); } catch (e) { return empty(); }
    if (!d || d.v !== 1 || !Array.isArray(d.games)) return empty();
    return { v: 1, games: d.games.filter(validGame).map(copyGame).slice(-LIMIT) };
  }

  function serialize(history) {
    return JSON.stringify(history);
  }

  // Adds a solved game, replacing an earlier record with the same id; keeps the newest LIMIT.
  function record(history, game) {
    const games = history.games.filter(g => g.id !== game.id).concat([copyGame(game)]);
    return { v: 1, games: games.slice(-LIMIT) };
  }

  function remove(history, id) {
    return { v: 1, games: history.games.filter(g => g.id !== id) };
  }

  // The distribution key for a game solved in this many guesses.
  function bucket(guesses) {
    return guesses >= 7 ? '7+' : String(guesses);
  }

  function stats(history) {
    const dist = {};
    for (const key of BUCKETS) dist[key] = 0;
    let total = 0;
    for (const g of history.games) {
      dist[bucket(g.rows.length)]++;
      total += g.rows.length;
    }
    const played = history.games.length;
    return { played, average: played ? total / played : null, dist };
  }

  const api = { LIMIT, BUCKETS, empty, parse, serialize, record, remove, bucket, stats };

<script>// Wording for the round review. Pure; loaded as a classic script in the page (defines Summary)
// and via require() in Node tests.
(function (root) {
  'use strict';

  const up = word => word.toUpperCase();
  const num = k => k.toLocaleString('en-US');
  const count = (k, one, many) => `${num(k)} ${k === 1 ? one : many}`;
  // Whole numbers (with separators) from 9.95 up, where one decimal would round to 10.0; one decimal below.
  const avg = x => (x >= 9.95 ? num(Math.round(x)) : x.toFixed(1));

  const FINAL = {
    only: () => 'Solved — the only word left.',
    shot: l => `Solved — a 1-in-${num(l.n)} shot.`,
    outside: () => 'Solved (wasn’t in the candidate list).',
  };
  const VERDICT = {
    pick: l => `Solver’s pick (avg ${avg(l.avgLeft)} left).`,
    sharper: l => `Sharper than the solver’s pick ${up(l.pick)} (avg ${avg(l.avgLeft)} left vs ${avg(l.pickAvgLeft)}).`,
    worse: l => `Solver: ${up(l.pick)} (avg ${avg(l.pickAvgLeft)} left vs your ${avg(l.avgLeft)}).`,
  };

  // One review line (from Solver review) as a sentence or three.
  function lineText(l) {
    if (l.noFit) return 'No word fit here — a tile may be misread.';
    const parts = [];
    if (l.final) parts.push(FINAL[l.final](l));
    else if (l.verdict) parts.push(`${num(l.n)} → ${count(l.left, 'word', 'words')}.`);
    else parts.push(`${num(l.n)} → ${count(l.left, 'word', 'words')} (avg ${avg(l.avgLeft)} left).`);
    if (l.verdict) parts.push(VERDICT[l.verdict](l));
    if (l.usual) parts.push(`Your usual: ${up(l.usual)} (avg ${avg(l.usualAvgLeft)}).`);
    if (l.luck) parts.push(l.luck === 'lucky' ? 'Lucky.' : 'Unlucky.');
    return parts.join(' ');
  }

    if (review.judged === 0) return '';
    return `You matched the solver on ${review.matched} of ${count(review.judged, 'guess', 'guesses')}.`;

<script>// UI for the Five-Letter Solver page. Uses Solver (solver.js), GameState (state.js), GameHistory (history.js) and Summary (summary.js).
/* global Solver, GameState, GameHistory, Summary */
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const DATA = JSON.parse($('data').textContent);
  const LISTS = {};
  for (const key of ['answers', 'allowed', 'common', 'extras']) LISTS[key] = DATA.lists[key].split(' ');
  const ALLOWED = new Set(LISTS.allowed);
  const TABLE = DATA.table;
  const CHIP_LIMIT = 40;
  const COLOR_NAMES = ['grey', 'yellow', 'green'];
  const KEYS = { settings: 'fls.settings', game: 'fls.game', history: 'fls.history' };

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ } },
  };

  function loadSettings() {
    let saved = null;
    try { saved = JSON.parse(store.get(KEYS.settings) || 'null'); } catch (e) { saved = null; }
    return GameState.validateSettings(saved, GameState.DEFAULT_SETTINGS);
  }

  let settings = loadSettings();
  let game = GameState.restore(store.get(KEYS.game), Date.now()) || GameState.newGame(settings.opener, Date.now());
  let analysis = null;
  let roundReview = null;
  let history = GameHistory.parse(store.get(KEYS.history));
  let thinking = false;
  let latest = 0;
  let showAll = false;
  let failed = false;
  let autoFilled = '';
  const engine = makeEngine();

  const saveGame = () => store.set(KEYS.game, GameState.serialize(game, Date.now()));
  const saveSettings = () => store.set(KEYS.settings, JSON.stringify(settings));
  const saveHistory = () => store.set(KEYS.history, GameHistory.serialize(history));
  // Another tab or instance may have saved games since this page loaded, so every change and
  // every read of the statistics starts from what is stored now.
  const loadHistory = () => GameHistory.parse(store.get(KEYS.history));
  function changeHistory(fn) { history = fn(loadHistory()); saveHistory(); }
  const up = word => word.toUpperCase();
  const fmt = sc => `${sc.expected.toFixed(3)} expected · ${sc.outcomes} outcomes · worst ${sc.worst}`;

  // Scoring runs in a Worker built from the inline sources; falls back to this thread.
  // Jobs are 'analyze' (live recommendations) and 'review' (the solved round).
  function makeEngine() {
    let local = null;
    const runLocal = (type, rows, opts) => {
      if (!local) local = Solver.createSolver(LISTS);
      return local[type](rows, opts);
    };
    const waiting = new Map();
    let worker = null;
    let nextId = 0;

    // Only the newest pending job is worth re-running; older ones resolve null and are ignored.
    function fallBack() {
      worker = null;
      document.body.dataset.engine = 'main';
      const newest = Math.max(0, ...waiting.keys());
      for (const [id, job] of waiting) {
        if (id !== newest) { job.resolve(null); continue; }
        try { job.resolve(runLocal(job.type, job.rows, job.opts)); } catch (err) { job.reject(err); }
      }
      waiting.clear();
    }

    try {
      const code = $('solver-src').textContent + '\n' + $('worker-src').textContent;
      worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
      worker.onmessage = e => {
        const job = waiting.get(e.data.id);
        if (job) { waiting.delete(e.data.id); job.resolve(e.data.result); }
      };
      worker.onerror = fallBack;
      worker.postMessage({ type: 'init', lists: LISTS });
      document.body.dataset.engine = 'worker';
    } catch (err) {
      fallBack();
    }

    return {
      run(type, rows, opts) {
        return new Promise((resolve, reject) => {
          if (!worker) {
            setTimeout(() => { try { resolve(runLocal(type, rows, opts)); } catch (err) { reject(err); } }, 30);
            return;
          }
          const id = ++nextId;
          waiting.set(id, { resolve, reject, type, rows, opts });
          worker.postMessage({ type, id, rows, opts });
        });
      },
    };
  }

  function solverRows() {
    return game.rows.map(r => ({ word: r.word, pattern: Solver.colorsToPattern(r.colors) }));
  }

  function knownFor(rows) {
    if (rows.length !== 1 || settings.includeExtras || rows[0].word !== TABLE.opener) return null;
    return TABLE.entries[rows[0].pattern] || null;
  }

  // Mid-game this analyses the position; once solved it reviews the round instead.
  function recompute() {
    const rows = solverRows();
    const id = ++latest;
    const solved = GameState.isSolved(game);
    analysis = null;
    roundReview = null;
    failed = false;
    thinking = rows.length > 0;
    render();
    if (!thinking) return;
    const job = solved
      ? engine.run('review', rows, settings)
      : engine.run('analyze', rows, { includeExtras: settings.includeExtras, known: knownFor(rows) });
    job.then(result => {
      if (id !== latest) return;
      if (!result) throw new Error('no result');
      thinking = false;
      if (solved) {
        roundReview = result;
        render();
        return;
      }
      analysis = result;
      const rec = Solver.recommend(result, settings);
      // Replace an empty guess, or one we filled in ourselves earlier (settings may have changed).
      if (rec && (game.active.word === '' || game.active.word === autoFilled)) {
        autoFilled = rec.score.word;
        game = GameState.setActiveWord(game, rec.score.word);
        saveGame();
      }
      render();
    }).catch(err => {
      if (id !== latest) return;
      console.warn(err);
      thinking = false;
      failed = true;
      render();
    });
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // The word in the row was put there by the app (opener or recommendation), not chosen or typed.
  function isSuggested() {
    const word = game.active.word;
    return word !== '' && (word === autoFilled || (game.rows.length === 0 && word === settings.opener));
  }

  // Focus the invisible field, which brings up the phone keyboard. Must run inside a tap or key handler.
  function startTyping(clearSuggestion) {
    if (GameState.isSolved(game)) return;
    if (clearSuggestion && isSuggested()) {
      autoFilled = '';
      useWord('');
    }
    const guess = $('guess');
    guess.focus({ preventScroll: true });
    guess.setSelectionRange(guess.value.length, guess.value.length);
    render();
  }

  function useWord(word) {
    game = GameState.setActiveWord(game, word);
    saveGame();
    render();
  }

  function renderBoard(solved) {
    const board = $('board');
    const focused = document.activeElement;
    const focusIndex = focused && focused.classList.contains('tile') && board.contains(focused)
      ? [...focused.parentNode.children].indexOf(focused) : -1;
    board.replaceChildren();
    for (const row of game.rows) {
      const r = el('div', 'row');
      row.colors.forEach((c, i) => r.append(el('div', `tile c${c}`, up(row.word[i]))));
      board.append(r);
    }
    if (solved) return;
    const r = el('div', 'row active');
    const word = game.active.word;
    const typing = document.activeElement === $('guess');
    game.active.colors.forEach((c, i) => {
      const tile = el('button', `tile c${c}`, up(word[i] || ''));
      tile.type = 'button';
      if (typing && i === word.length) tile.classList.add('cursor');
      // Letters change colour; an empty tile is where the next letter goes, so it opens the keyboard.
      if (i < word.length) {
        tile.setAttribute('aria-label', `Letter ${i + 1}, ${COLOR_NAMES[c]}. Tap to change.`);
        tile.addEventListener('click', () => {
          game = GameState.cycleColor(game, i);
          saveGame();
          render();
        });
      } else {
        tile.setAttribute('aria-label', `Letter ${i + 1}, empty. Tap to type.`);
        tile.addEventListener('click', () => startTyping(false));
      }
      r.append(tile);
    });
    board.append(r);
    if (focusIndex >= 0) r.children[focusIndex].focus();
  }

  // The word offered by the "make default" link: the first guess played, or being typed.
  function defaultCandidate() {
    if (game.rows.length === 0) return game.active.word.length === 5 ? game.active.word : '';
    return game.rows.length === 1 ? game.rows[0].word : '';
  }

  function renderEntry(solved) {
    $('entry').hidden = solved;
    const word = game.active.word;
    const guess = $('guess');
    if (guess.value.toLowerCase() !== word) guess.value = up(word);
    const unknown = word.length === 5 && !ALLOWED.has(word);
    $('next').disabled = word.length !== 5;
    $('solved').disabled = word.length !== 5;
    $('next').textContent = unknown ? 'Use anyway' : 'Next';
    $('hint').hidden = !unknown;
    const makeDefault = $('make-default');
    const candidate = defaultCandidate();
    makeDefault.hidden = !candidate || candidate === settings.opener;
    makeDefault.textContent = `Make ${up(candidate)} my default`;
    $('undo').disabled = game.rows.length === 0;
  }

  function showScore(prefix, sc) {
    const button = $(`${prefix}-word`);
    button.textContent = up(sc.word);
    button.onclick = () => useWord(sc.word);
    $(`${prefix}-stats`).textContent = fmt(sc);
  }

  // Runners-up are there in case the game rejects the best one.
  function renderSplitters(list) {
    $('splitters').replaceChildren(...list.map(sc => {
      const item = el('li');
      const button = el('button', 'word-btn', up(sc.word));
      button.type = 'button';
      button.addEventListener('click', () => useWord(sc.word));
      item.append(button, el('div', 'stats', `${sc.expected.toFixed(3)} · ${sc.outcomes} out · worst ${sc.worst}`));
      return item;
    }));
  }

  function renderChips(box, words, limit) {
    box.replaceChildren(...words.slice(0, limit).map(word => {
      const chip = el('button', 'chip', up(word));
      chip.type = 'button';
      chip.addEventListener('click', () => useWord(word));
      return chip;
    }));
  }

  function renderRound() {
    const box = $('round');
    if (!roundReview) {
      box.replaceChildren(el('li', 'round-note', failed ? 'Couldn’t review this round.' : 'Reviewing…'));
      $('round-closing').textContent = '';
      return;
    }
    box.replaceChildren(...roundReview.lines.map(line => {
      const item = el('li');
      const tiles = el('div', 'mini-row');
      tiles.setAttribute('aria-label', `${up(line.word)}: ${line.colors.map(c => COLOR_NAMES[c]).join(', ')}`);
      line.colors.forEach((c, i) => {
        const tile = el('span', `tile mini c${c}`, up(line.word[i]));
        tile.setAttribute('aria-hidden', 'true');
        tiles.append(tile);
      });
      item.append(tiles, el('p', 'round-text', Summary.lineText(line)));
      return item;
    }));
    $('round-closing').textContent = Summary.closingText(roundReview);
  }

  // Played, average and a bar per guess count; the bar for `guesses` (if given) is highlighted.
  function renderStats(box, guesses) {
    history = loadHistory();
    const s = GameHistory.stats(history);
    if (s.played === 0) {
      box.replaceChildren(el('p', 'stats-empty', 'No games yet.'));
      return;
    }
    const max = Math.max(...GameHistory.BUCKETS.map(key => s.dist[key]));
    const mine = guesses ? GameHistory.bucket(guesses) : null;
    const bars = el('div', 'dist');
    for (const key of GameHistory.BUCKETS) {
      if (key === '7+' && s.dist[key] === 0) continue;
      const row = el('div', key === mine ? 'dist-row mine' : 'dist-row');
      const bar = el('span', 'dist-bar', String(s.dist[key]));
      bar.style.width = `${(s.dist[key] / max) * 100}%`;
      const n = s.dist[key];
      const what = key === '7+' ? '7 or more guesses' : `${key} ${key === '1' ? 'guess' : 'guesses'}`;
      row.setAttribute('aria-label', `${what}: ${n} ${n === 1 ? 'game' : 'games'}`);
      const label = el('span', 'dist-key', key);
      label.setAttribute('aria-hidden', 'true');
      bar.setAttribute('aria-hidden', 'true');
      row.append(label, bar);
      bars.append(row);
    }
    box.replaceChildren(el('p', 'stats-head', `Played ${s.played} · Avg ${s.average.toFixed(2)}`), bars);
  }

  function renderResults(solved) {
    const status = $('status'), banner = $('banner'), results = $('results');
    document.body.classList.toggle('thinking', thinking);
    status.className = 'status';
    banner.className = 'banner';
    banner.hidden = true;
    results.hidden = true;
    $('summary').hidden = !solved;

    if (solved) {
      status.textContent = `Solved in ${game.rows.length}.`;
      status.classList.add('solved');
      renderRound();
      renderStats($('summary-stats'), game.rows.length);
      return;
    }
    if (game.rows.length === 0) {
      status.textContent = 'Tap the tiles to match the colours you got, then press Next.';
      return;
    }
    if (failed) {
      banner.textContent = 'Something went wrong while scoring — try Undo or New game.';
      banner.hidden = false;
      return;
    }
    if (thinking || !analysis) {
      status.textContent = 'Thinking…';
      return;
    }
    status.textContent = '';
    const a = analysis;
    if (a.source === 'none') {
      banner.textContent = 'No word fits these colours — probably a misread tile. Undo and check the last row.';
      banner.hidden = false;
      return;
    }
    if (a.source === 'wider') {
      banner.textContent = 'No answer-list word fits — using obscure fits.';
      banner.classList.add('info');
      banner.hidden = false;
    }

    results.hidden = false;
    const rec = Solver.recommend(a, settings);
    showScore('rec', rec.score);
    $('rec-note').textContent = rec.probe ? 'probe — can’t be the answer' : 'could be the answer';
    $('rec-note').className = rec.probe ? 'note probe' : 'note';
    renderSplitters(a.splitters);
    showScore('c', a.c);

    $('cands-label').textContent = `Candidates (${a.main.length})`;
    renderChips($('cands'), a.main, showAll ? a.main.length : CHIP_LIMIT);
    const more = $('cands-more');
    more.hidden = a.main.length <= CHIP_LIMIT;
    more.textContent = showAll ? 'Show fewer' : `Show all ${a.main.length}`;

    $('obscure-box').hidden = a.wider.length === 0;
    const inScoring = a.source !== 'main' ? ' — included in scoring' : '';
    $('obscure-label').textContent = `Obscure fits (${a.wider.length})${inScoring}`;
    renderChips($('obscure'), a.wider, a.wider.length);
  }

  function render() {
    const solved = GameState.isSolved(game);
    renderBoard(solved);
    renderEntry(solved);
    renderResults(solved);
  }

  function submit(step = GameState.commit) {
    if (GameState.isSolved(game) || game.active.word.length !== 5) return;
    game = step(game);
    if (GameState.isSolved(game)) {
      changeHistory(h => GameHistory.record(h, { id: game.id, at: Date.now(), rows: game.rows }));
    }
    showAll = false;
    autoFilled = '';
    saveGame();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    recompute();
  }

  function resetGame() {
    game = GameState.newGame(settings.opener, Date.now());
    showAll = false;
    autoFilled = '';
    saveGame();
    recompute();
  }

  // The field is only rewritten when characters were stripped, so the caret stays put while typing.
  function readGuess(input) {
    const clean = GameState.sanitizeWord(input.value);
    if (input.value.toLowerCase() !== clean) input.value = clean;
    useWord(clean);
  }
  $('guess').addEventListener('input', e => { if (!e.isComposing) readGuess(e.target); });
  $('guess').addEventListener('compositionend', e => readGuess(e.target));
  // Focus moving in or out of the field shows or hides the typing cursor on the active row.
  $('guess').addEventListener('focus', render);
  $('guess').addEventListener('blur', render);
  $('edit').addEventListener('click', () => startTyping(true));
  // Enter submits from the page body, a tile or the guess field (tile clicks re-render and drop focus).
  // Letters and Backspace typed there go into the row, so a computer keyboard works without tapping first.
  document.addEventListener('keydown', e => {
    if (e.isComposing || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('dialog[open]')) return;
    const t = e.target;
    const onRow = t === document.body || (t.classList && t.classList.contains('tile'));
    if (e.key === 'Enter' && (onRow || t === $('guess'))) {
      e.preventDefault();
      submit();
    } else if (onRow && (/^[a-z]$/i.test(e.key) || e.key === 'Backspace')) {
      e.preventDefault();
      const letter = e.key !== 'Backspace';
      startTyping(letter);
      if (GameState.isSolved(game)) return;
      useWord(letter ? game.active.word + e.key : game.active.word.slice(0, -1));
    }
  });
  $('next').addEventListener('click', () => submit());
  $('solved').addEventListener('click', () => submit(GameState.solve));
  $('undo').addEventListener('click', () => {
    // Undoing a solve takes the game back out of the statistics; solving again re-records it.
    if (GameState.isSolved(game)) {
      changeHistory(h => GameHistory.remove(h, game.id));
    }
    game = GameState.undo(game);
    autoFilled = '';
    saveGame();
    recompute();
  });
  // One confirm dialog for every "are you sure": message, button label and what to do on OK.
  let onConfirm = null;
  function askConfirm(message, label, action) {
    $('confirm-msg').textContent = message;
    $('confirm-ok').textContent = label;
    onConfirm = action;
    $('confirm').returnValue = '';
    $('confirm').showModal();
  }
  $('confirm').addEventListener('close', () => {
    const action = onConfirm;
    onConfirm = null;
    if ($('confirm').returnValue === 'ok' && action) action();
  });
  $('new').addEventListener('click', () => {
    if (!GameState.needsDiscardConfirm(game)) { resetGame(); return; }
    askConfirm('Discard this game?', 'Discard', resetGame);
  });
  $('stats-btn').addEventListener('click', () => {
    renderStats($('stats-body'), GameState.isSolved(game) ? game.rows.length : null);
    $('stats').showModal();
  });
  // Opens over the settings dialog, which stays open behind it.
  $('reset-stats').addEventListener('click', () => {
    askConfirm('Reset statistics?', 'Reset', () => {
      changeHistory(() => GameHistory.empty());
      render();
    });
  });
  for (const cancel of document.querySelectorAll('dialog [data-cancel]')) {
    cancel.addEventListener('click', () => cancel.closest('dialog').close('cancel'));
  }
  $('make-default').addEventListener('click', () => {
    settings = GameState.validateSettings({ opener: defaultCandidate() }, settings);
    saveSettings();
    render();
  });
  $('cands-more').addEventListener('click', () => { showAll = !showAll; render(); });
  $('settings-btn').addEventListener('click', () => {
    $('set-opener').value = up(settings.opener);
    $('set-maxn').value = settings.maxN;
    $('set-maxgap').value = settings.maxGap;
    $('set-extras').checked = settings.includeExtras;
    $('settings').returnValue = '';
    $('settings').showModal();
  });
  $('settings').addEventListener('close', () => {
    if ($('settings').returnValue !== 'save') return;
    const prev = settings;
    settings = GameState.validateSettings({
      opener: $('set-opener').value,
      maxN: $('set-maxn').value,
      maxGap: $('set-maxgap').value,
      includeExtras: $('set-extras').checked,
    }, settings);
    saveSettings();
    if (game.rows.length === 0 && game.active.word === prev.opener) {
      game = GameState.setActiveWord(game, settings.opener);
      saveGame();
    }
    recompute();
  });

  render();
  recompute();
})();
</script>
</body>
</html>
